---
# Comment ansible_connection or ansible_host to switch between a podman and an ssh connection.
# Should be able to test ssh connection (after a podman start) with: 'ssh -i ${molecule_dir}/testkey -p 2222 root@localhost'
ansible_connection: containers.podman.podman
#ansible_host: localhost
ansible_user: root
ansible_port: 2222
ansible_host_key_checking: false
ansible_pipelining: true
ansible_ssh_common_args: '-o "SetEnv TERM=dumb"'
ansible_ssh_private_key_file: ../testkey
container_volumes:
  - ../testkey.pub:/root/.ssh/authorized_keys:ro,z
container_ports: '2222:22'
container_image: quay.io/ansible/fedora-test-container:42-v2.20-1
container_command: /sbin/init
container_privileged: false
container_systemd: true

---
# tasks/main.yml file for role certbot_py

- name: Assert Supported O/S Family
  ansible.builtin.assert:
    that: ansible_facts['os_family'] in ['Debian', 'RedHat']

- name: Install Debian python Packages
  ansible.builtin.package:
    name:
      - ansible-core
      - python3-dev
      - python3-venv
      - libaugeas-dev
      - gcc
    state: present
    update_cache: true
  no_log: true
  when: ansible_facts['os_family'] in ['Debian']

- name: Install RedHat python Packages
  ansible.builtin.package:
    name:
      - ansible-core
      - python3-devel
      - augeas-devel
      - gcc
      - logrotate
    state: present
    update_cache: true
  no_log: true
  when: ansible_facts['os_family'] in ['RedHat']

- name: Remove Pre-Built cerbot Packages
  ansible.builtin.package:
    name:
      - certbot
    state: absent

- name: Install certbot into Python virtual environment
  ansible.builtin.pip:
    name: 
      - certbot
      - certbot-nginx
      - pip
    state: latest
    virtualenv: /opt/certbot
    virtualenv_command: python3 -m venv
  no_log: true

- name: Create certbot symlink
  ansible.builtin.file:
    src: /opt/certbot/bin/certbot
    dest: /usr/local/bin/certbot
    state: link

- name: Get certbot version
  ansible.builtin.command:
    argv:
      - /usr/local/bin/certbot
      - --version
  register: certbot_command
  changed_when: false

- name: Extract version components
  ansible.builtin.set_fact:
    certbot_version: "{{ certbot_command.stdout.split(' ')[1] }}"

- name: Verify Certbot Version
  assert:
    that:
      - certbot_version is version('5.4.0', '>=')

- name: Copy certbot rotate config
  ansible.builtin.copy:
    src: files/logrotate.conf
    dest: /etc/logrotate.d/certbot
    mode: '0644'

- name: Prevent certbot log pollution
  ansible.builtin.lineinfile:
    path: /etc/letsencrypt/cli.ini
    regexp: '^max-log-backups'
    line: "max-log-backups = 0"
    state: present
    create: true
    mode: '0644'

- name: Copy certbot service
  ansible.builtin.copy:
    src: files/certbot.service
    dest: /usr/lib/systemd/system
    mode: '0644'

- name: Copy certbot timer
  ansible.builtin.copy:
    src: files/certbot.timer
    dest: /usr/lib/systemd/system
    mode: '0644'
  notify: Enable and Reload certbot Timer

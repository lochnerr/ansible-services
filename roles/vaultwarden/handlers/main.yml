---
# handlers/main.yml file for role vaultwarden

- name: Reload systemd daemon configuration
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ vaultwarden_user }}"
  listen: Reload and Restart Service

- name: Restart systemd user service
  ansible.builtin.systemd_service:
    name: vaultwarden
    scope: user
    state: started
  become: true
  become_user: "{{ vaultwarden_user }}"
  listen: Reload and Restart Service
